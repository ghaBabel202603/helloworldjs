name: Deploy React App

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect environment
        id: env
        uses: ghaBabel202603/public-actions/detect-environment@v1
        with:
          branch: ${{ github.ref }}

      - name: Build app
        id: build
        uses: ghaBabel202603/public-actions/build-node-app@v1
        with:
          base_path: .

      - name: Deploy app
        uses: ghaBabel202603/public-actions/deploy-gh-pages@v1
        with:
          environment: ${{ steps.env.outputs.environment }}
          artifact_name: ${{ steps.build.outputs.artifact_name }}
